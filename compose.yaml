name: stockpilot

x-php-service: &php-service
  build:
    context: ./docker/php
    args:
      UID: ${APP_UID:-1000}
      GID: ${APP_GID:-1000}
  image: stockpilot/php:local
  volumes:
    - ./apps/api:/var/www/html
  environment:
    APP_ENV: local
    DB_HOST: db
    DB_PORT: 3306
    DB_DATABASE: ${DB_DATABASE:-stockpilot}
    DB_USERNAME: ${DB_USERNAME:-stockpilot}
    DB_PASSWORD: ${DB_PASSWORD:-stockpilot_dev}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    MAIL_HOST: mail
    MAIL_PORT: 1025
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - stockpilot

services:
  api:
    <<: *php-service
    container_name: stockpilot-api
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: stockpilot-nginx
    ports:
      - '${APP_PORT:-8000}:80'
    volumes:
      - ./apps/api:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - stockpilot
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: stockpilot-db
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-stockpilot}
      MYSQL_USER: ${DB_USERNAME:-stockpilot}
      MYSQL_PASSWORD: ${DB_PASSWORD:-stockpilot_dev}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev}
    ports:
      - '${DB_PORT_HOST:-3307}:3306'
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - stockpilot
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: stockpilot-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - stockpilot
    restart: unless-stopped

  worker:
    <<: *php-service
    container_name: stockpilot-worker
    user: '${APP_UID:-1000}:${APP_GID:-1000}'
    command: ['php', 'artisan', 'queue:work', '--sleep=3', '--tries=3']
    restart: unless-stopped

  scheduler:
    <<: *php-service
    container_name: stockpilot-scheduler
    user: '${APP_UID:-1000}:${APP_GID:-1000}'
    command: ['php', 'artisan', 'schedule:work']
    restart: unless-stopped

  mail:
    image: axllent/mailpit:latest
    container_name: stockpilot-mail
    ports:
      - '8025:8025'
      - '1025:1025'
    networks:
      - stockpilot
    restart: unless-stopped

  db-admin:
    image: adminer:latest
    container_name: stockpilot-db-admin
    ports:
      - '8081:8080'
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    profiles: ['tools']
    networks:
      - stockpilot
    restart: unless-stopped

  web:
    image: node:22-alpine
    container_name: stockpilot-web
    working_dir: /app
    user: '${APP_UID:-1000}:${APP_GID:-1000}'
    environment:
      HOME: /tmp
      NPM_CONFIG_CACHE: /tmp/.npm
    volumes:
      - ./apps/web:/app
    ports:
      - '4200:4200'
    command:
      - sh
      - -c
      - npm install && npm start -- --host 0.0.0.0 --poll 2000 --proxy-config proxy.conf.docker.json
    profiles: ['frontend']
    networks:
      - stockpilot
    restart: unless-stopped

networks:
  stockpilot:
    driver: bridge

volumes:
  db-data:
  redis-data:
