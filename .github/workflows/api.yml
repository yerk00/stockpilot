name: API

on:
  push:
    paths:
      - 'apps/api/**'
      - 'docker/php/**'
      - 'contracts/**'
      - 'compose.yaml'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'docker/php/**'
      - 'contracts/**'
      - 'compose.yaml'
      - '.github/workflows/api.yml'

permissions:
  contents: read

jobs:
  quality:
    name: Tests and static analysis
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: stockpilot
          MYSQL_USER: stockpilot
          MYSQL_PASSWORD: stockpilot_dev
          MYSQL_ROOT_PASSWORD: root_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot_dev --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, curl, pdo_mysql, pdo_sqlite, sqlite3, zip, gd, intl, bcmath, redis, pcntl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: stockpilot
          DB_USERNAME: stockpilot
          DB_PASSWORD: stockpilot_dev
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Run tests
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan test

      - name: Check formatting
        run: ./vendor/bin/pint --test

      - name: Static analysis
        run: ./vendor/bin/phpstan analyse --no-progress
