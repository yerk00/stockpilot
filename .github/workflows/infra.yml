name: Infra

on:
  push:
    paths:
      - 'docker/**'
      - 'compose.yaml'
      - '.github/workflows/infra.yml'
  pull_request:
    paths:
      - 'docker/**'
      - 'compose.yaml'
      - '.github/workflows/infra.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate Compose and build PHP image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config

      - name: Build PHP image
        run: docker build -f docker/php/Dockerfile docker/php
